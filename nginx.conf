server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /en/ {
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /en/404.html;
    }
    
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
